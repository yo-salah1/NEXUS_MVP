<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Voice Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style8.css">

    <style>
        /* ── Voice Page Overrides ── */
        .voice-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Avatar */
        .voice-avatar-wrap {
            position: relative;
            width: 180px;
            height: 180px;
        }
        .voice-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        .voice-glow {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.35) 0%, transparent 70%);
            z-index: 1;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50%       { transform: scale(1.1); opacity: 1; }
        }

        /* Instruction */
        .voice-instruction {
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }

        /* User query */
        .voice-query {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            text-align: center;
            min-height: 24px;
            max-width: 480px;
        }

        /* Mic Button */
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 0 24px rgba(124,58,237,0.5);
            transition: all 0.3s ease;
            position: relative;
        }
        .mic-btn:hover { transform: scale(1.08); }
        .mic-btn svg { color: white; width: 28px; height: 28px; }

        .mic-btn.listening {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 0 32px rgba(220,38,38,0.6);
            animation: mic-pulse 1s ease-in-out infinite;
        }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 24px rgba(220,38,38,0.5); }
            50%       { box-shadow: 0 0 48px rgba(220,38,38,0.9); }
        }

        /* Status */
        .voice-status {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            min-height: 18px;
        }

        /* Emotion Card — fixed in page, not floating */
        .emotion-panel {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px 20px;
            display: none;
        }
        .emotion-panel.visible { display: block; }

        .emotion-label {
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .emotion-name {
            font-family: 'Sora', sans-serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .emotion-conf {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
        }
        .prob-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .prob-label { width: 58px; }
        .prob-bar-wrap {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .prob-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .prob-pct { width: 32px; text-align: right; }

        /* AI Response Panel */
        .ai-panel {
            width: 100%;
            max-width: 380px;
            background: rgba(124,58,237,0.12);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 16px;
            padding: 16px 20px;
            display: none;
        }
        .ai-panel.visible { display: block; }
        .ai-panel-label {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .ai-panel-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.65;
            color: rgba(255,255,255,0.85);
        }

        /* Particles canvas */
        .particle-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Make main-content flex column */
        .main-content {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i data-lucide="chevrons-right" class="toggle-icon"></i>
        </button>

        <nav class="sidebar-nav">
            <div><img src="NEXUS_logo.png" /></div>
            <br/><br/>

            <a href="index7.html">
                <div class="nav-item" id="homeNav" data-tooltip="Home">
                    <i data-lucide="home" class="nav-icon"></i>
                    <span class="nav-label">Home</span>
                </div>
            </a>

            <div class="nav-item" id="newChatNav" data-tooltip="New Chat">
                <i data-lucide="plus" class="nav-icon"></i>
                <span class="nav-label">New Chat</span>
            </div>

            <div class="submenu" id="chatTypeSubmenu">
                <a href="index10.html">
                    <div class="submenu-item" data-tooltip="Video Chat">
                        <i data-lucide="video" class="submenu-icon"></i>
                        <span class="submenu-label">Video</span>
                    </div>
                </a>
                <a href="index9.html">
                    <div class="submenu-item active" data-tooltip="Audio Chat">
                        <i data-lucide="mic" class="submenu-icon"></i>
                        <span class="submenu-label">Audio</span>
                    </div>
                </a>
                <a href="index8.html">
                    <div class="submenu-item" data-tooltip="Text Chat">
                        <i data-lucide="message-square" class="submenu-icon"></i>
                        <span class="submenu-label">Text</span>
                    </div>
                </a>
            </div>

            <a href="index13.html">
                <div class="nav-item" id="prompets" data-tooltip="Prompts">
                    <i data-lucide="target" class="nav-icon"></i>
                    <span class="nav-label">Prompts</span>
                </div>
            </a>

            <a href="index11.html">
                <div class="nav-item" id="historyNav" data-tooltip="History">
                    <i data-lucide="clock" class="nav-icon"></i>
                    <span class="nav-label">History</span>
                </div>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index12.html">
                <div class="nav-item" id="settingsNav" data-tooltip="Settings">
                    <i data-lucide="settings" class="nav-icon"></i>
                    <span class="nav-label">Settings</span>
                </div>
            </a>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <main class="main-content">
        <canvas id="particleCanvas" class="particle-canvas"></canvas>

        <div class="voice-main">

            <!-- Avatar -->
            <div class="voice-avatar-wrap">
                <div class="voice-glow"></div>
                <img src="avatar.png" alt="NEXUS AI">
            </div>

            <!-- Instruction -->
            <p class="voice-instruction">Press the mic and speak to NEXUS</p>

            <!-- User Query -->
            <p class="voice-query" id="userQuery">What's on your mind?</p>

            <!-- Mic Button -->
            <button class="mic-btn" id="voiceBtn">
                <i data-lucide="mic"></i>
            </button>

            <!-- Status -->
            <p class="voice-status" id="statusText"></p>

            <!-- Emotion Panel -->
            <div class="emotion-panel" id="emotionPanel">
                <div class="emotion-label">Detected Emotion</div>
                <div class="emotion-name" id="emotionName">—</div>
                <div class="emotion-conf" id="emotionConf"></div>
                <div id="probBars"></div>
            </div>

            <!-- AI Response Panel -->
            <div class="ai-panel" id="aiPanel">
                <div class="ai-panel-label">NEXUS Response</div>
                <div class="ai-panel-text" id="aiText"></div>
            </div>

        </div>
    </main>
</div>

<script src="script9.js"></script>
</body>
</html>
