<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Log in with Phone</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="phone-login-container">
            <!-- Logo Section -->
            <div class="logo-section">
                
                <img src="NEXUS_logo.png" alt="NEXUS" class="logo">
            </div>
            
            <!-- Icon/Avatar -->
            <div class="icon-section">
                <div class="icon-wrapper">
                    <img src="page1icon(1).png" alt="Icon" class="main-icon">
                </div>
            </div>
            
            <!-- Heading -->
            <h1 class="page-title">Log in with phone</h1>
            
            <!-- Subtitle -->
            <p class="page-subtitle">
                You'll get smarter responses and can upload files,<br class="desktop-only">
                images and more
            </p>
            
            <!-- Phone Login Form -->
            <form class="phone-form" id="phoneForm">
                <!-- Phone Input with Country Code -->
                <div class="phone-input-wrapper">
                    <!-- Country Code Selector -->
                    <div class="country-code-selector" id="countrySelector">
                        <img src="https://flagcdn.com/w40/eg.png" alt="Egypt" class="flag-icon" id="flagIcon">
                        <span class="country-code" id="countryCode">+20</span>
                        <i data-lucide="chevron-down" class="chevron-icon"></i>
                    </div>
                    
                    <!-- Phone Number Input -->
                    <input 
                        type="tel" 
                        id="phoneInput" 
                        class="phone-input" 
                        placeholder="01095668444"
                        required
                        autocomplete="tel"
                        maxlength="15"
                    >
                </div>
                
                <!-- Continue Button -->
                 <a href="index6.html">
                <button type="submit" class="btn btn-primary" id="continueBtn">
                    <span class="btn-text">Continue</span>
                </button>
                </a>
            </form>
            
            <!-- Country Code Dropdown -->
            <!-- <div class="country-dropdown" id="countryDropdown">
                <div class="dropdown-header">
                    <h3 class="dropdown-title">Select Country</h3>
                    <button type="button" class="close-dropdown" id="closeDropdown">
                        <i data-lucide="x" class="close-icon"></i>
                    </button>
                </div>
                <div class="dropdown-search">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" class="search-input" id="searchCountry" placeholder="Search country...">
                </div>
                <div class="country-list" id="countryList">
                   
                   </div>
            </div>
            
           
            <!-- <div class="dropdown-overlay" id="dropdownOverlay"></div> --> 
        </div>
        
        <!-- Floating Particles -->
        <canvas id="particleCanvas" class="particle-canvas"></canvas>
    </div>

    <!-- Custom Script -->
    <script src="script5.js"></script>
</body>
</html>
