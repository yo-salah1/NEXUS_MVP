<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Video Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style8.css">

    <style>
        /* ── Video Page Layout ── */
        .video-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ── Video Area ── */
        .video-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 24px 0;
            gap: 16px;
            min-height: 0;
        }

        /* Main video feed */
        .video-feed-wrap {
            position: relative;
            flex: 1;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1); /* mirror */
        }

        .camera-off-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: rgba(255,255,255,0.3);
        }
        .camera-off-placeholder svg {
            width: 48px; height: 48px;
            opacity: 0.3;
        }
        .camera-off-placeholder p {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        /* FER overlay on video */
        .fer-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 10px 14px;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .fer-overlay.visible { display: block; }
        .fer-overlay-emotion {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }
        .fer-overlay-conf {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            margin-top: 2px;
        }

        /* Right panel — emotion details */
        .emotion-panel {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .emotion-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
        }

        .emotion-card-title {
            font-family: 'Sora', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }

        .emotion-big {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .emotion-conf-text {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 14px;
        }

        .prob-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 5px 0;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
        }
        .prob-label { width: 52px; font-family: 'DM Sans', sans-serif; }
        .prob-bar-wrap {
            flex: 1;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .prob-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .prob-pct { width: 28px; text-align: right; font-size: 10px; }

        /* Status card */
        .status-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-align: center;
        }
        .status-dot {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #9ca3af;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.active { background: #22c55e; animation: blink 1.2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── Controls Bar ── */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px 24px 24px;
        }

        .ctrl-btn {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: rgba(255,255,255,0.7);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.14); transform: scale(1.07); }
        .ctrl-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-color: transparent;
            color: white;
            box-shadow: 0 0 20px rgba(124,58,237,0.45);
        }
        .ctrl-btn svg { width: 20px; height: 20px; }

        .ctrl-btn-end {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: none;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            color: white;
            box-shadow: 0 0 20px rgba(220,38,38,0.4);
        }
        .ctrl-btn-end:hover { transform: scale(1.08); background: #b91c1c; }
        .ctrl-btn-end svg { width: 22px; height: 22px; }

        .ctrl-label {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-top: 4px;
        }

        .ctrl-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* particles */
        .particle-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i data-lucide="chevrons-right" class="toggle-icon"></i>
        </button>

        <nav class="sidebar-nav">
            <div><img src="NEXUS_logo.png" /></div>
            <br/><br/>

            <a href="index7.html">
                <div class="nav-item" id="homeNav" data-tooltip="Home">
                    <i data-lucide="home" class="nav-icon"></i>
                    <span class="nav-label">Home</span>
                </div>
            </a>

            <div class="nav-item" id="newChatNav" data-tooltip="New Chat">
                <i data-lucide="plus" class="nav-icon"></i>
                <span class="nav-label">New Chat</span>
            </div>

            <div class="submenu" id="chatTypeSubmenu">
                <a href="index10.html">
                    <div class="submenu-item active" data-tooltip="Video Chat">
                        <i data-lucide="video" class="submenu-icon"></i>
                        <span class="submenu-label">Video</span>
                    </div>
                </a>
                <a href="index9.html">
                    <div class="submenu-item" data-tooltip="Audio Chat">
                        <i data-lucide="mic" class="submenu-icon"></i>
                        <span class="submenu-label">Audio</span>
                    </div>
                </a>
                <a href="index8.html">
                    <div class="submenu-item" data-tooltip="Text Chat">
                        <i data-lucide="message-square" class="submenu-icon"></i>
                        <span class="submenu-label">Text</span>
                    </div>
                </a>
            </div>

            <a href="index13.html">
                <div class="nav-item" id="prompets" data-tooltip="Prompts">
                    <i data-lucide="target" class="nav-icon"></i>
                    <span class="nav-label">Prompts</span>
                </div>
            </a>

            <a href="index11.html">
                <div class="nav-item" id="historyNav" data-tooltip="History">
                    <i data-lucide="clock" class="nav-icon"></i>
                    <span class="nav-label">History</span>
                </div>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index12.html">
                <div class="nav-item" id="settingsNav" data-tooltip="Settings">
                    <i data-lucide="settings" class="nav-icon"></i>
                    <span class="nav-label">Settings</span>
                </div>
            </a>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <main class="video-main">
        <canvas id="particleCanvas" class="particle-canvas"></canvas>

        <!-- Video + Emotion Panel -->
        <div class="video-area">

            <!-- Video Feed -->
            <div class="video-feed-wrap">
                <video id="videoFeed" autoplay playsinline muted></video>

                <!-- Camera off placeholder -->
                <div class="camera-off-placeholder" id="cameraOffIcon">
                    <i data-lucide="video-off"></i>
                    <p>Camera is off</p>
                </div>

                <!-- FER overlay on video -->
                <div class="fer-overlay" id="ferOverlay">
                    <div class="fer-overlay-emotion" id="ferOverlayEmotion">—</div>
                    <div class="fer-overlay-conf" id="ferOverlayConf"></div>
                </div>
            </div>

            <!-- Emotion Panel -->
            <div class="emotion-panel">

                <!-- Status -->
                <div class="status-card" id="statusCard">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Camera off</span>
                </div>

                <!-- Emotion Details -->
                <div class="emotion-card" id="emotionCard">
                    <div class="emotion-card-title">Facial Emotion</div>
                    <div class="emotion-big" id="emotionBig" style="color:#9ca3af;">—</div>
                    <div class="emotion-conf-text" id="emotionConf">Waiting for camera...</div>
                    <div id="probBars"></div>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <div class="ctrl-wrap">
                <button class="ctrl-btn" id="micBtn">
                    <i data-lucide="mic-off"></i>
                </button>
                <div class="ctrl-label">Mic</div>
            </div>

            <div class="ctrl-wrap">
                <button class="ctrl-btn" id="cameraBtn">
                    <i data-lucide="video"></i>
                </button>
                <div class="ctrl-label">Camera</div>
            </div>

            <div class="ctrl-wrap">
                <button class="ctrl-btn-end" id="endBtn">
                    <i data-lucide="phone-off"></i>
                </button>
                <div class="ctrl-label" style="color:rgba(255,255,255,0.35)">End</div>
            </div>

            <div class="ctrl-wrap">
                <button class="ctrl-btn" id="ferBtn" title="Toggle FER Analysis">
                    <i data-lucide="scan-face"></i>
                </button>
                <div class="ctrl-label">FER</div>
            </div>
        </div>
    </main>
</div>

<script src="script10.js"></script>
</body>
</html>
